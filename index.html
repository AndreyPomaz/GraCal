<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>CoutureCAD Pro</title>
  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --surface: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

    body { background-color: var(--bg); color: var(--text-main); padding: 16px; padding-bottom: 80px; }

    .app-container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    header { text-align: center; margin-bottom: 8px; }
    header h1 { font-size: 1.2rem; font-weight: 800; background: linear-gradient(135deg, #a5b4fc, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }

    .input-box { display: flex; flex-direction: column; gap: 4px; }
    .input-box label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .input-box input { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    .input-box input:focus { border-color: var(--primary); }

    .btn-save { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 10px; width: 100%;}
    .btn-save:hover { background: #4f46e5; }

    .measure-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-top: 8px; }
    .measure-code { font-weight: 800; color: #ec4899; min-width: 40px; font-size: 0.85rem; }
    .measure-name { font-size: 0.85rem; color: #e2e8f0; flex: 1; margin: 0 10px; }
    .measure-value { font-size: 1rem; font-weight: 700; color: #38bdf8; }

    #saved-clients { margin-top: 10px; }
    .client-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .client-card strong { color: #a5b4fc; }
    .client-card small { color: var(--text-muted); font-size: 0.75rem; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>CoutureCAD Pro</h1>
  </header>

  <!-- 1. Профиль клиента -->
  <section class="card">
    <div class="input-box">
      <label>Имя клиента</label>
      <input type="text" placeholder="Анна Иванова" id="client-name">
    </div>
  </section>

  <!-- 2. Параметры фигуры (Калькулятор) -->
  <section class="card">
    <div class="grid-3">
      <div class="input-box">
        <label>Рост (см)</label>
        <input type="number" id="height" value="170" step="1">
      </div>
      <div class="input-box">
        <label>Обхват груди (см)</label>
        <input type="number" id="chest" value="80" step="1">
      </div>
      <div class="input-box">
        <label>Обхват бедер (см)</label>
        <input type="number" id="hips" value="90" step="1">
      </div>
    </div>
  </section>

  <!-- Блок сохранения -->
  <button class="btn-save" onclick="saveClient()">💾 Сохранить клиента</button>

  <!-- 3. Расчет мерок -->
  <section class="card">
    <div id="measure-list"></div>
  </section>

  <!-- Список сохраненных -->
  <div id="saved-clients"></div>
</div>

<script>
  // Данные мерок (5 для MVP)
  const measurements = [
    { code: "P", name: "Рост", base: 164, dp: 6, dog: 6 },
    { code: "Сш", name: "П/о шеи", base: 17.4, dp: 0, dog: 0.4 },
    { code: "Сг1", name: "П/о груди 1", base: 42.6, dp: 0.2, dog: 1.6 },
    { code: "Ст", name: "П/о талии", base: 34.4, dp: -0.1, dog: 2 },
    { code: "Сб", name: "П/о бедер с жив.", base: 49, dp: 0, dog: 2 }
  ];

  const heightInput = document.getElementById('height');
  const chestInput = document.getElementById('chest');
  const listContainer = document.getElementById('measure-list');

  // Функция расчета
  function render() {
    const H = parseFloat(heightInput.value) || 164;
    const Og = parseFloat(chestInput.value) || 88;
    const k_rost = (H - 164) / 6;
    const k_razm = (Og - 88) / 4;

    listContainer.innerHTML = '';
    measurements.forEach(item => {
      const calculated = item.base + (item.dp * k_rost) + (item.dog * k_razm);
      const row = document.createElement('div');
      row.className = 'measure-row';
      row.innerHTML = `
        <span class="measure-code">${item.code}</span>
        <span class="measure-name">${item.name}</span>
        <span class="measure-value">${calculated.toFixed(1)}</span>
      `;
      listContainer.appendChild(row);
    });
  }

  [heightInput, chestInput].forEach(el => el.addEventListener('input', render));
  render(); // Первый запуск

  // --- ЛОГИКА СОХРАНЕНИЯ (LocalStorage) ---

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  function saveClient() {
    const data = {
        name: document.getElementById('client-name').value || "Без имени",
        height: document.getElementById('height').value,
        chest: document.getElementById('chest').value,
        date: new Date().toLocaleDateString()
    };
    if(data.name === "Без имени") { alert("Введите имя клиента!"); return; }

    let db = JSON.parse(localStorage.getItem('clients') || '[]');
    db.push(data);
    localStorage.setItem('clients', JSON.stringify(db));
    alert('Клиент сохранен!');
    loadClients();
  }

  function loadClients() {
    const db = JSON.parse(localStorage.getItem('clients') || '[]');
    const list = document.getElementById('saved-clients');
    list.innerHTML = db.length ? '<h3 style="margin:15px 0 10px; font-size:0.9rem; color:var(--text-muted)">Сохраненные клиенты:</h3>' : '';
    list.innerHTML += db.map(c => `
      <div class="client-card">
        <strong>${c.name}</strong> <small>${c.date}</small><br>
        ОГ: ${c.chest} | Рост: ${c.height}
      </div>
    `).join('');
  }
  loadClients();
</script>
</body>
</html>
